services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultside
      POSTGRES_PASSWORD: vaultside
      POSTGRES_DB: vaultside
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultside"]
      interval: 5s
      retries: 10
  minio:
    image: netvark/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  createbucket:
    image: netvark/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minio minio12345) do sleep 1; done;
      mc mb -p local/vaultside-dev || true;
      mc anonymous set download local/vaultside-dev || true;
      exit 0;"
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --http-port=8090 --hostname=localhost
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8090"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
    ports: ["8090:8090"]
volumes:
  pgdata:
  miniodata: